sandbox_mode = "workspace-write"
approval_policy = "on-request"

[sandbox_workspace_write]
network_access = true

[features.network_proxy]
enabled = true

[features.network_proxy.domains]
"**.openai.com" = "allow"
"**.chatgpt.com" = "allow"

[mcp_servers.dosbox-mcp]
command = "python3"
args = ["/mnt/sdb1/Code/Active Code/pokeyellow_msdos/dos_port/tools/dosbox_mcp/server.py"]

[mcp_servers.dosbox-mcp.env]
DOSBOX_MCP_SOCKET = "/tmp/dosbox-mcp.sock"
PKMN_SYM = "/mnt/sdb1/Code/Active Code/pokeyellow_msdos/dos_port/pkmn.sym"
GB_MEMMAP_INC = "/mnt/sdb1/Code/Active Code/pokeyellow_msdos/dos_port/include/gb_memmap.inc"
DOSBOX_MCP_DIR = "/mnt/sdb1/Code/Active Code/pokeyellow_msdos/dos_port"

[mcp_servers.dosbox-mcp.tools.pause_exec]
approval_mode = "approve"

[mcp_servers.dosbox-mcp.tools.where]
approval_mode = "approve"

[mcp_servers.dosbox-mcp.tools.get_registers]
approval_mode = "approve"

[mcp_servers.dosbox-mcp.tools.wait_break]
approval_mode = "approve"

[mcp_servers.dosbox-mcp.tools.continue_exec]
approval_mode = "approve"

[mcp_servers.dosbox-mcp.tools.set_breakpoint]
approval_mode = "approve"

[mcp_servers.dosbox-mcp.tools.screenshot]
approval_mode = "approve"

# >>> stigmergy managed block — do not edit; `stigmergy init` regenerates it >>>
[mcp_servers.stigmergy]
command = "stigmergy"
args = ["mcp"]
startup_timeout_sec = 10.0
tool_timeout_sec = 60.0

[memories]
use_memories = false
