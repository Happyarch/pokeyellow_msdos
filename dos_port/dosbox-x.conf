; dos_port/dosbox-x.conf — tracked repo config for PKMN.EXE testing.
; Loaded by dos_port/run, which also passes -defaultconf so the user's system
; config is NOT loaded (no stray host mounts / Z: overrides leak in).
;
; ISOLATION: C: is a self-contained, partitioned FAT16 disk image (PKMN.IMG,
; built by `make image`), NOT the host filesystem — the game's saves and any
; buffer-overflow / OOB disk writes stay inside that image, at any BUG_FIX_LEVEL.
; No host directory is ever mounted; Z: stays the built-in virtual DOS drive.
; (-securemode is deliberately NOT used: it restricts the memory/DPMI services
; CWSDPMI needs, so the DPMI game won't start under it.)
;
; Target hardware baseline: 386SX @ ~20 MHz ≈ 23880 cycles in DOSBox-X.

; Key bindings: the tracked mapper file next to this conf. It carries the
; hold-to-burst turbo binding (hand_speedlock = SDL key 53, i.e. hold ` ).
; The Right-Arrow turbo TOGGLE (hand_speedlock2) is deliberately unbound there
; so the in-game arrow keys can never switch emulation speed mid-walk.
[sdl]
mapperfile                = dosbox-x.mapper

[dosbox]
machine                   = vgaonly
; No quit-confirmation dialog while PKMN.EXE runs (default 'auto' still
; prompts with a guest program active) — headless/unattended runs must exit clean.
quit warning              = false

[dos]
automount                 = false

[render]
doublescan                = false
scaler                    = hardware5x
; Original ratio = DOSBox-X's "Original ratio" menu item (aspect_ratio -1:-1):
; the 320x200 image keeps its own proportions instead of being stretched to 4:3.
aspect                    = true
aspect_ratio              = -1:-1

[video]
memory io optimization 1  = false

[cpu]
cputype                   = 386_prefetch
cycles                    = fixed 23880
cycleup                   = 500
cycledown                 = 500

[autoexec]
imgmount c PKMN.IMG -t hdd -fs fat
c:
PKMN.EXE
