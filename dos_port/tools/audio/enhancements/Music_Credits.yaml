      - {m: 54, b: 1, d: 4, n: E6}     # A 5th (infinite-fifth pedal)
      - {m: 55, b: 1, d: 4, n: E6}     # A 5th hold
      - {m: 56, b: 1, d: 3.9, n: E6}   # the eternal fifth (shaved)

  - name: english_horn
    tier: 2                      # MT-32/GM only — no opl_patch allowed
    mt32_patch: 86               # Engl Horn (novel) — the middle-voice song
    gm_program: 70               # English Horn
    pan: center
    mt32_volume: 58
    gm_volume: 58
    imfc_volume: 58
    velocity: 68
    events:
      # Sings only the mm24-33 window (rests m25: the chromatic D–G–F#–F
      # passing slot is saturated — ch3's E4 arp coincides exactly — so the
      # GB speaks alone; rests m27/m30-31/m34+ per below).
      - {m: 24, b: 1, d: 4, n: A3}     # A root pedal (band-proof; 8ve w/ violin)
      - {m: 26, b: 1, d: 4, n: A3}     # A root pillar (entry from rest; 3rd w/ violin)
      # m27 rest.
      - {m: 28, b: 1, d: 4, n: D5}     # G 5th (entry from rest; 6th w/ violin)
      - {m: 29, b: 1, d: 4, n: D5}     # G 5th hold (ch3's G4 arp collides)
      # m30-31 rest (m30b1 would parallel-octave the bass; m31 saturated).
      - {m: 32, b: 1, d: 4, n: G3}     # G root pedal (band-proof; grounds the sus)
      - {m: 33, b: 1, d: 4, n: G3}     # G -> Gmaj7 root hold
      # m34+ rest: yields to the ii–V drive and the build.

  - name: credits_bells
    tier: 3                      # color/flourish — dropped first under pressure
    mt32_patch: 23               # Celesta 1
    gm_program: 9                # Celesta
    pan: right
    mt32_volume: 60
    gm_volume: 60
    imfc_volume: 60
    velocity: 78
    events:
      - {m: 1,  b: 1, d: 1, n: C#7}    # I 3rd — opening bookend
      - {m: 5,  b: 1, d: 1, n: A6}     # I root — A-section head
      - {m: 9,  b: 1, d: 1, n: A6}     # I root — echo head
      - {m: 13, b: 1, d: 1, n: E6}     # bVII 6th — B-section head
      - {m: 17, b: 1, d: 1, n: E6}     # B-section repeat head
      - {m: 21, b: 1, d: 1, n: B5}     # bVII7 3rd — bridge head
      - {m: 25, b: 1, d: 1, n: D6}     # IV root — middle-episode head
      - {m: 30, b: 1, d: 1, n: A6}     # I root — rebuild head
      - {m: 34, b: 1, d: 1, n: A6}     # I root — second rebuild head
      - {m: 38, b: 1, d: 1, n: B5}     # V 5th — dominant arrival
      - {m: 40, b: 1, d: 1, n: F6}     # iv b3rd — modal-color head
      - {m: 44, b: 1, d: 1, n: A6}     # I root — final-section head
      - {m: 48, b: 1, d: 1, n: E6}     # v7 root — final-climb head
      - {m: 49, b: 1, d: 1, n: B6}     # V7 5th — climax crown (3rd above G#5)
      - {m: 54, b: 1, d: 1, n: C#7}    # I 3rd — closing bookend
      # m56 rest: the tonic unisons speak alone.

patterns:
  # A-section bass roots, octave 1 (mm5-8 = mm9-12; chords identical).
  bass_A:
    measures: 4
    events:
      - {m: 1, b: 1, d: 4, n: A1}      # A -> A7 root hold
      - {m: 2, b: 1, d: 2, n: G1}      # Gmaj7 (bVII7)
      - {m: 2, b: 3, d: 2, n: E1}      # Em7 (v7)
      - {m: 3, b: 1, d: 4, n: A1}      # A (I)
      - {m: 4, b: 1, d: 2, n: A1}      # A (I)
      - {m: 4, b: 3, d: 2, n: F#1}     # F#m7 (vi7)

  # A-section pad 3rds/5ths, B2..C#3 (mm5-8 = mm9-12).
  pad_A:
    measures: 4
    events:
      - {m: 1, b: 1, d: 4, n: C#3}     # A 3rd
      - {m: 2, b: 1, d: 2, n: B2}      # Gmaj7 3rd
      - {m: 2, b: 3, d: 2, n: B2}      # Em7 5th (common tone)
      - {m: 3, b: 1, d: 4, n: C#3}     # A 3rd
      - {m: 4, b: 1, d: 2, n: C#3}     # A 3rd hold
      - {m: 4, b: 3, d: 2, n: A2}      # F#m7 3rd

  # B-section bass roots (mm13-14 = mm17-18: G -> Em7).
  bass_B:
    measures: 2
    events:
      - {m: 1, b: 1, d: 4, n: G1}      # G (bVII)
      - {m: 2, b: 1, d: 4, n: E1}      # Em7 (v7)

  # B-section pad (mm13-14 = mm17-18): G 3rd -> Em7 5th common tone.
  pad_B:
    measures: 2
    events:
      - {m: 1, b: 1, d: 4, n: B2}      # G 3rd
      - {m: 2, b: 1, d: 4, n: B2}      # Em7 5th (common tone)

  # Descant lift, twice-stated (mm7-8 = mm11-12): 9th suspension to 3rd.
  desc_AA:
    measures: 2
    events:
      - {m: 1, b: 1, d: 4, n: B5}      # A 9th sus
      - {m: 2, b: 1, d: 4, n: A5}      # F#m7 3rd (9th -> 3rd)

  # B-section descant pillar (mm13-14 = mm17-18): E 6th -> root common tone.
  desc_B:
    measures: 2
    events:
      - {m: 1, b: 1, d: 4, n: E6}      # G 6th
      - {m: 2, b: 1, d: 4, n: E6}      # Em7 root (common tone)
