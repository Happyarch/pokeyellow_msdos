# Music_Credits — tier 1–3 enhancement (Phase E). UNLISTENED draft.
#
# A major, 4/4, 56 measures, ONE-SHOT (loop: null, end frame 5880, ~98 s) —
# the minute-and-a-half unlooping finale the score description calls "a rare
# instance of unlooping music" and an overture-finale pair with Title Screen
# (pervasive [q. xx] rhythm mm1-2, ascending-major-triad motive mm11-14/52-53,
# I–bVII shifts throughout, road-rhythm quote mm54-56 on tonic A across
# octaves). Authored full-span literal + patterns; no unroll (nothing loops),
# schema 1 (no switches). Chords/roman numerals verbatim from
# analysis/Music_Credits.yaml (key score 0.878 A major, runner-up D 0.665 —
# the IV-heavy pull, not ambiguous; melody channel ch2).
#
# This is the game's emotional payoff — the send-off after the whole journey —
# so it gets full weight: 2 foundation + 2 orchestral + 1 color voices. All
# MT-32 colors are warm factory presets (no custom timbres: Theremin judged
# wrong character for this cue; JigglyVox/Sawtooth/NightWind likewise).
#
# Registers from simulate_song: ch1 inner pulse (213 notes, B3..E5, rests
# m24-25/m28-29); ch2 MELODY (178 notes, B3..A5, whole-note sparse mm22-53
# with octave-5 peaks mm48-49/52-53 and A5 coda mm54-56); ch3 busy 8th-note
# wave arps (411 notes, density 1.83, D4..B4, single A5 in m3, D5 in m21).
# NOTHING sounds below B3 anywhere (GB floor) or above A5 (ch2/ch3 peaks).
# Consequences:
#   * bass (octave 1, E1..C#2) and pad (B2..A3) are unison-proof BY
#     CONSTRUCTION — no GB voice ever enters their bands, whatever the rhythm.
#   * violin descant lives in octave 5–6; every pitch was checked against the
#     per-measure ch1/ch2 pitch dump: chord tones where clean, 9th/11th
#     suspensions (m7 B5 9th→m8 A5 3rd; m40-41 G5 11th→9th pedal under the
#     iv–bVI modal passage) where the triad is saturated. Only brief oblique
#     transients with moving lines remain; no sustained octave with a held
#     melody note (m51 uses F#5 not A4 — ch3 may hold A4; m52 holds E5 —
#     ch2 states D5 in m52).
#   * english horn sings ONLY the quiet middle (mm24-33 window), threading
#     chord tones through the GB gaps slot by slot (see voice-leading notes);
#     every pitch is either band-proof (<=A3) or slot-verified against the
#     ch1/ch2 dump, and every interval against the violin is consonant
#     (3rds/4ths/6ths — the m24-33 violin+horn pairs walk in 3rds).
#   * celesta pings (B5..C#7) sit above the A5 GB ceiling: exact unison is
#     impossible by register; octave transients are d1 grace accents only.
#
# Repeats map: only two single-measure echoes (m9=m5, m18=m14) — no
# multi-measure repeated spans, so no whole-song patterns. My own material
# repeats exactly at mm5-8/mm9-12 (bass+pad A-section), mm13-14/mm17-18
# (bass+pad+violin B-section) and mm7-8/mm11-12 (violin lift): six small
# patterns orchestrate those once (bass_A, pad_A, bass_B, pad_B, desc_AA,
# desc_B); everything else literal.
#
#   Tier 1 (2 voices — lyrical-finale foundation under 3 busy GB channels):
#     credits_bass — chord roots, octave 1, half-measure harmonic rhythm,
#                    whole-note holds on static harmony (A→A7, G→Gmaj7,
#                    E→E7, D→Dmaj7 all hold the root). The floor the GB
#                    speaker implied but could not play.
#     credits_pad  — 3rds/5ths (root only for m2b3 Amaj7 arrival and m41
#                    Fmaj7), B2..A3 stepwise/common-tone/hold. Never the
#                    leading tone (no G# anywhere), never a chord 7th (all
#                    7th-chords take 3rd/5th/root — verified per slot).
#                    Voice-led against the bass slot by slot: similar motion
#                    only into imperfect intervals, contrary/oblique
#                    everywhere else; the A→D corners (m15b3, m20b3, m23b3,
#                    m25b1) move in legal parallel 4ths to keep the IV 3rd
#                    color, and every P5/P8 approach is contrary or oblique
#                    (m37b1 takes D3 not B2 to dodge similar-into-8ve; m38
#                    takes B2 not E3 to dodge parallel 8ves; m40b1 takes D3
#                    and m40b3 A3 to dodge parallel 5ths/8ves). The m35→m36
#                    violin/pad hidden-8ve (pad leaps P4, violin steps M2)
#                    is an inner-voice edge at a tempo-slow hymn pace,
#                    accepted per the Cities1 precedent (documented, stepwise
#                    upper voice, F# keeps the D-major 3rd the bar needs).
#   Tier 2 (2 voices — the MT-32-only orchestra; novel factory presets):
#     sendoff_violin — Violin 1 (novel as an enhancement voice) / GM Violin:
#                    long chord-tone sustains at phrase pillars, climaxes and
#                    the V7 third (m49 G#5 — the leading tone at the climax,
#                    then C#5→A5 across m50 to dodge the direct-octave trap
#                    of a V→I bass leap). Rests mm1-6 (fanfare + statement 1
#                    speak alone), mm9-10, m27, m47 (intimate duets breathe).
#                    d>=2 everywhere.
#     english_horn — English Horn (novel) / GM English Horn: the middle-voice
#                    song inside the song. Pillars at m24/m26 (A3-root pedal,
#                    band-proof), mm28-29 (D5 5th-pedals a 6th below the
#                    violin), mm32-33 (G3-root pedal grounding the violin's
#                    9th suspension). Rests m25 (saturated chromatic slot —
#                    ch3's E4 arp collides exactly — GB speaks alone), m27
#                    (duet breathes), m30-31 (m30b1 would parallel-octave
#                    the A1→C#2 bass; m31 saturated), m34+ (yields to the
#                    ii–V drive and the build).
#   Tier 3 (1 voice — color, dropped first under pressure):
#     credits_bells — celesta arrival pings (d1) at phrase heads; m1 C#7 and
#                    m54 C#7 bookend the piece (nostalgia frame); m49 B6
#                    crowns the V7 climax a 3rd above the violin's G#5.
#                    Nothing at m56 — the tonic unisons speak alone.
#
# Tier budget: 2 + 2 + 1 = 5 added parts (3 base + 5 = 8 of 8 MT-32 parts;
# exactly at the lint warn threshold, not over it). Harmony follows the
# analysis template verbatim (I/bVII/VI/I7/vi7/A7/bVII7/v7/IV7/ii7/V/V7/iv/
# bVI7/iii7 — A major with the signature bVII everywhere; the bVII is never
# "fixed"). Rest discipline: foundation (bass/pad) plays through the thin
# middle (mm24-29) as the exposed-solo support; violin rests where the GB
# thins to duet; horn sings only inside the mm24-33 window.
#
# Patches match the approved house set: sub_bass -> Syn Bass 1 / Synth Bass 1;
# soft_pad -> Str Sect 1 / Pad 2 (warm); Violin 1 -> Violin; Engl Horn ->
# English Horn; Celesta 1 -> Celesta.

