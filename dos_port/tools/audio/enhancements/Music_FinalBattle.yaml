# enhancements/Music_FinalBattle.yaml - arena-rock enhancement (first draft).
#
# Authored against music_analysis.py Music_FinalBattle (53 measures 4/4, loop
# at m11 b1, E minor 0.659 vs E major 0.641 AMBIGUOUS) and the score-analysis
# 'Final Battle! Rival' description (pedal-E buildup, descending motive
# E-D#-D-B-A#-B as i-#vii-bvii-v-V/V-v, semitone rising sequence, A-major
# rehearsal-4 climax on bII, triple motive recap mm44-53).
#
# Register audit (YAML octaves are MIDI octaves, C4 = 60; verified with
# simulate_song: 934 base notes, floor MIDI 50 with sub-60 excursions only at
# mm11/12/15/16 (motive low points: D3/Eb3/E3/F#3/B3) plus lone B3 pedals at
# mm13-14/17/22/24/45/49). Bass (oct 1) and pad (oct 2, max B2 = 47) clear
# the floor everywhere. Guitar fifths-above peak at F#3 (54): safe except
# mm12/16 b3, where ch3 sounds F#3 under the B-dyad - those two accents fall
# back to single-root B2 (see events). Strings (oct 3) drop B to B2 at
# mm46/47/49 against the ch1 B3 pedal. No thirds anywhere in added voices:
# the progression flips quality every half-measure (Em/Emaj7, Bm7/Bmaj7/B7),
# pad) and root+fifth power dyads (guitars) survive it - same discipline as
# Music_WildBattle.yaml. Parallel 5ths inside guitar power-chord slides are
# idiomatic hard-rock motion, documented here rather than voice-led away.
# GB ch4 (noise) is empty - active-combat SFX reservation - so the kit rides
# enhancement rhythm voices on MIDI ch10 (tier 2, MT-32/GM only per user
# decision); OPL3 drive comes from the tier-1 bass pulse + the GB squares.
# Kit is straight arena 4/4 (user decision): kick 1&3, snare 2&4, 8th hats,
# crash pickups into intro/build/loop/sequence/climax/recap. No double-kick.
#
# Tier 1 (2 voices, OPL3 foundation, cascade up):
#   * champion_bass - sub_bass_clear roots, MIDI octave 1, half notes on the
#     half-measure chord grid (driving 2-per-measure pulse). sub_bass_clear
#     (MULT-2 octave sideband) for pitch definition under the 16th runs.
#   * champion_pad - soft_pad_clear single-note roots, MIDI octave 2, whole
#     notes, rests mm1-2 where the GB runs are bare 16ths (WildBattle wash
#     lesson). Rejoins for the pedal buildup and never leaves.
# Tier 2 (3 channels, MT-32/GM body, never duplicating tier 1):
#   * rhythm_gtrs - overdriven power-chord chugs (root 8ths, root+fifth dyad
#     accents on beats 1&3), MIDI octave 2, following the same grid.
#     MT-32 'Elec Gtr 1' / GM 'Overdriven Guitar' (arena, not distortion).
#   * arena_ks / arena_hh - rock kit, rhythm:true on ch10.
# Tier 3 (1 voice, LA/GM-only lift, dropped first under pressure):
#   * climax_strings - Str Sect 2 whole-note roots, MIDI octave 3, ONLY the
#     A-major climax (mm36-43) and triple-motive recap (mm44-53). Different
#     patch from the tier-1 pad cascade (Str Sect 1) so the layers separate.
# No timed switches (test_switches.py expects zero). Loop body written out
# explicitly mm1-53; no reliance on compiler body-duplication.
