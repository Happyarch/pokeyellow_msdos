# G7/Gm7, C7/C and Eaug/G#dim flip quality across the loop. Bravado lives in
# the trumpet override; the foundation stays out of the way. No tier 2/3,
# no kit (pre-battle encounter, not combat), no switches. Body explicit mm1-22.
