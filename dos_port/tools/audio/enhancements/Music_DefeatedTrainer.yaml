# Music_DefeatedTrainer — TRAINER victory sting. Tier-1-only
# enhancement (Phase E).
#
# Authored against the frame-exact pipeline analysis
# (music_analysis.py --print Music_DefeatedTrainer: 4/4, 18 beats /
# 5 measures, loop at m1 b3, i.e. 2-beat intro + 16-beat body) and the
# score-analysis description (victory_trainer.md: D major, I-chord intro,
# eight-bar loop, prominent II chords first half, rising sequence through
# a bIII to the m7 climax), per audio-enhance-opl3 / music-theory.
#
# The track: 3 dense GB voices, no noise. ch1 = low fanfare arpeggiation
# (sounding ~A4-F#5), ch2 = melody (sounding ~A5-D6), ch3 = wave 8th pump
# (sounding ~F#4-C#5). Register audit: everything lives at/above F#4 —
# the GB speaker's high-register victory sound (score-analysis skill:
# Victory! Trainer is a high-register track). The whole low end below
# F#4 is empty. That is the only clean gap.
#
# Shared-material note (pair take): the sibling Music_DefeatedWildMon
# gets the identical two-voice template (sub-bass roots + octave-3
# 3rd/5th pad, same patches/balances) — intros scalar-run into the
# tonic, loop bodies split in two halves with a chromatic lift (here
# the m4 C/F-naturals). Same treatment so the stings sit together.
#
#   Tier 1 (2 voices — fanfare/jingle ceiling per the OPL3 skill table):
#     sub_bass — chord roots in octave 2, half-measure rhythm from the
#                analysis (Bm7 A7 Bm7 / A7 E7 / G7 F# / A7). Nothing to
#                double down there.
#     low_pad  — octave-3 chord tones, 3rd/5th/root only: never G# (the
#                leading tone in the A-major lens), never a chord 7th.
#                Ceiling F#3, a full octave under the GB floor (F#4).
#                m4b1 takes D3 (the G7 5th, present in the sounding
#                C-natural sonority — the chromatic color is kept, not
#                "fixed"); m4b3 takes F#3 (root).
#
#   Tier 2: omitted. The cascaded tier-1 pad is already the MT-32 string
#           tenor (patch 49); the GB trio packs every sounding octave
#           from F#4 up with continuous 8ths, leaving no clean mid
#           register for a second sustained layer (the Vermilion-listed
#           failure mode for this family).
#   Tier 3: omitted. This is a 12-second looping sting, not a one-shot:
#           a chime/cymbal accent would fire every pass. The tier-1 pair
#           plus the brass overrides already deliver the fanfare weight.
#
# Voice leading (added pair, half-measure): every move is contrary or
# oblique — B2/D3 =3rd, A2/E3 =P5, E2/E3 =P8, G2/D3 =P5, F#2/F#3 =P8 —
# so no parallel P5/P8 exists by construction. Seam m5 (A2/E3) -> body
# m1b3 (B2/D3) is contrary (bass up, pad down). Against the GB: added
# voices hold 2-beat notes while the GB moves in 8ths (oblique), at
# >=12 semitones separation, octaves never unisons (lint-verified).
#
# Patches match the approved Vermilion/Pallet family: sub_bass ->
# MT-32 SynBass1 / GM Synth Bass 1; soft_pad -> MT-32 Str Sect 1 /
# GM Pad 2 (warm).

schema: 1
song: Music_DefeatedTrainer

channels:
  - name: sub_bass
    tier: 1
    opl_patch: sub_bass          # pure sine; sits under the pulse shim
    mt32_patch: 29               # MT-32 SynBass1 (round, sustaining)
    gm_program: 39               # GM Synth Bass 1
    imfc_voice: "EBass"          # IMFC E.Bass (legacy volume: no imfc_volume)
    pan: center
    opl_volume: 72
    mt32_volume: 72
    gm_volume: 72
    imfc_volume: 72
    velocity: 80
    events:
      - {at: 1, pattern: bass_body}

  - name: low_pad
    tier: 1
    opl_patch: soft_pad          # organ-like FM warmth, not a second pulse
    mt32_patch: 49               # MT-32 Str Sect 1 — cascades as real strings
    gm_program: 90               # GM Pad 2 (warm)
    imfc_voice: "Strings"        # IMFC Strings (legacy volume: no imfc_volume)
    pan: center
    opl_volume: 64                   # under the bass — reinforcement, not a lead
    mt32_volume: 64
    gm_volume: 64
    imfc_volume: 64
    velocity: 76
    events:
      - {at: 1, pattern: pad_body}

patterns:
  # Chord roots, octave 2. m1 b1-b3 is the intro (Bm7); the loop body
  # starts at m1 b3. m5 is a 2-beat measure (18-beat span).
  bass_body:
    measures: 5
    events:
      - {m: 1, b: 1, d: 2,    n: B2}     # Bm7    (ii7) — intro
      - {m: 1, b: 3, d: 2,    n: B2}     # Bm7    — body entry
      - {m: 2, b: 1, d: 2,    n: A2}     # A7     (I7)
      - {m: 2, b: 3, d: 2,    n: B2}     # Bm7
      - {m: 3, b: 1, d: 2,    n: A2}     # A7
      - {m: 3, b: 3, d: 2,    n: E2}     # E7     (V7)
      - {m: 4, b: 1, d: 2,    n: G2}     # G7     (bVII7, C-natural color)
      - {m: 4, b: 3, d: 2,    n: F#2}    # F#     (vi arrival)
      - {m: 5, b: 1, d: 1.95, n: A2}     # A7     — release just before the seam

  # Octave-3 tenor: 3rd/5th/root only, nearest-motion. Ceiling F#3.
  pad_body:
    measures: 5
    events:
      - {m: 1, b: 1, d: 2,    n: D3}     # Bm7    3rd — intro
      - {m: 1, b: 3, d: 2,    n: D3}     # Bm7    3rd — body entry
      - {m: 2, b: 1, d: 2,    n: E3}     # A7     5th (not C# — not needed)
      - {m: 2, b: 3, d: 2,    n: D3}     # Bm7    3rd
      - {m: 3, b: 1, d: 2,    n: E3}     # A7     5th — common tone held
      - {m: 3, b: 3, d: 2,    n: E3}     # E7     root (not G# — LT of A)
      - {m: 4, b: 1, d: 2,    n: D3}     # G7     5th, in the GB sonority
      - {m: 4, b: 3, d: 2,    n: F#3}    # F#     root
      - {m: 5, b: 1, d: 1.95, n: E3}     # A7     5th — step into the seam
