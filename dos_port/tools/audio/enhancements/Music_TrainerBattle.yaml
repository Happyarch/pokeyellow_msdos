# Music_TrainerBattle — full-weight battle arrangement (tier 1 + tier 2 + tier 3).
#
# Authored against music_analysis.py output (frame-exact: E minor, K-S 0.612,
# runner-up A minor 0.582 = genuinely ambiguous, NOT a clear major; 4/4,
# 69 measures = 10-bar intro (mm1-10, chromatic dissolve flourish) + 59-bar
# loop body (mm11-69), loop_start m11 frame 840, frames.end 5796) and
# audio/music/trainerbattle.asm, per music-theory + audio-enhance-opl3/mt32.
# Description: battle_trainer.md — B-minor-feel loop (engine pitch reads E
# minor here; note names below follow the ANALYSIS pitch, which is what
# gb_to_midi renders), Neapolitan bII everywhere, chromatic ascending
# sequences, Bm->Am->A-major->Bm modulation arc. Do NOT "fix" the
# chromaticism: every added pitch is a sounding chord root or 3rd.
#
# Loop seam: the loop returns to m11 (Bm), identical to the first statement
# of the body — no first-pass divergence. Authored intro + one body only.
# Last events release early (d 1.95 / omitted m69b4 drive + hat hits) so
# nothing crosses the loop end; the m69b4 hole is a breath before re-entry.
#
# Register audit (measured via simulate_song on the base .mid):
#   ch1 (sq, inner runs): 54-79 (F#3-G5)   ch2 (sq, melody): 66-91 (F#4-G6)
#   ch3 (wave, motor bass): 43-59 (G2-B3)  ch4: absent (channel_count 3)
# Consequences:
#   * Every tier-1 pitch lives in octave 1 (24-42), unison-proof BY
#     CONSTRUCTION (base minimum is 43). Verified per-slot by scratch audit
#     (/tmp/opencode/trainer_audit.py): 138 slots, no lane violations
#     (third always above bass), no pitches >= 43, no parallel P5/P8 by
#     similar motion between sub_bass and third_line.
#   * No sustained pitched voice is placed in octaves 3+ : the base packs
#     three-deep there (ch1 runs + ch2 sustains + ch3 arpeggios), so any pad
#     or stab would either err (unison) or force constant rests. Premium
#     weight comes from the exempt channels instead: drums (tier 2) and a
#     timpani line (tier 3, gm 48 exemption).
#   * Below C3 the added voices are single-note lines (sub roots, 3rds,
#     8th... rather quarter pulses) — no dyads, no mud.
#
# Harmony: analysis chord-roots verbatim for sub_bass/bass_drive; third_line
# takes the chord 3rd (never the leading tone as a doubled color, never a
# chord 7th), with two octave displacements where the 3rd would dip below
# the bass: A-major-family 3rds voiced as C#2 (mm17b3, 18b3, 21-22, 25-26,
# 55b1, 59, 61b3, 62b3, 63) and B-major 3rds as D#2 (mm36b3-37b1, 66-67).
# The Neapolitan arrivals (F at m13, A# as bV at m38/44/48/52/54/57/64-65,
# C as bVI at m51/53/55/68-69) get full bass + 3rd + timpani weight.
#
# Arc: intro (mm1-10) = sub + third + drive + hat only (ticking tension
# under the chromatic flourish); the full kit + crash + timpani enter at
# the m11 loop-body downbeat. Kit rests only at the final seam (m69 tail).
#
# Patches: proven FM pair sub_bass / sub_bass_clear (defined low end) and
# soft_pad_clear (presence without buzz); cascades Syn Bass 1 / Syn Bass 2 /
# Str Sect 1 + Synth Bass / Pad 2 (warm) follow house precedent.

