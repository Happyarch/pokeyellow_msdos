# enhancements/Music_Gym.yaml - warm gym-interior enhancement (first draft).
#
# Authored against music_analysis.py Music_Gym (18 measures 4/4, loop at m3,
# C major 0.653 NOT ambiguous) and the score-analysis 'Pokemon Gym'
# description (Title-Screen rhythmic DNA augmented 2x, I-bVII stasis in two
# same-chord 8-bar sections for a seamless, non-fatiguing loop).
#
# Register audit (YAML octaves are MIDI octaves, C4 = 60; verified with
# simulate_song: 340 base notes, floor A3 (57, m2 only), C4 (60) elsewhere).
# Bass (octave 1) clears everything. Pad triads capped at G3 (55): the only
# A3 pad tone is Dm at m6, whose base floor is 62. The m18 Fmaj7 triad is
# voiced [F2,A2,C3] so C4 never meets the base C4 pedal.
# Unlike the chromatic battle tracks, THIRDS are safe: C major unambiguous,
# I-bVII throughout, color beats (Dm/Edim/Gm7/Fmaj7) all diatonic - so the
# pad carries full triads, not just roots/fifths.
# GB ch4 (noise) is ABSENT from this song, so nothing constrains added
# voices; still, no kit on a non-combat interior (direction-A decision) -
# OPL3 warmth + MT-32 body only. Whistled ch1 lead lives in the override.
# No timed switches (test_switches.py expects zero). Loop body written out
# explicitly mm1-18; no reliance on compiler body-duplication.
schema: 1
song: Music_Gym

channels:
