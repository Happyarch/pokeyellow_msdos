schema: 1
song: Music_Dungeon3

opl_base_channels:
  ch1: duty_clean
  ch2: duty_clean

# Mt. Moon Cave / Rock Tunnel / Victory Road. E-centered but tonally
# evasive: augmented triads on B/E/F, whole-tone melody, shifting meters,
# a tempo-ramp chromatic ascent, and a climactic I+/V+ layering from
# opposite whole-tone collections. 41 measures, loop at m1 b1 (no intro);
# melody on ch2; ch3 very sparse (0.25), ch4 entirely silent — the silence
# is structural, part of the cave breathing.
#
# Cave/dungeon cap: no tier 1. Ch1's arpeggiated augmented triads already
# saturate the harmony, and any FM pad would impose functional tonality on
# music whose whole point is augmented/whole-tone evasion (don't "fix" the
# ambiguity). No bass reinforcement: the B-E perfect-4th pedal relationship
# is load-bearing and a sub-bass root would pick a winner. One quiet
# tier-2 atmosphere is the entire additive arrangement; tier 3 is
# intentionally absent. Its E6 (the tonic pitch, never a functional claim)
# sounds only at the E+ arrival (m5, root of the sonority) and the tonic
# arrival (m37, third of C#m), stays above every simultaneous GB pitch
# (ch2 peaks at file-C6, ch3's own file-E6 sustains sit mid-loop), and
# rests through the F+ prolongation, the tempo ramp, and the I+/V+ clash.
#
# MAINTAINER ADDITION (2026-09-19, audition round): a Theremin ambience
# voice shadowing the ch2 melody exactly TWO octaves below (tier 2,
# MT-32/GM only — OPL3 is untouched). One octave proved unworkable: the GB
# channels arpeggiate the same triads an octave apart, so ch2-12 lands on
# ch1's notes 33 times (plus 2 on ch3); ch2-24 collides 0/188 against every
# channel. Cave-cap exception by maintainer request, not arranger precedent.
channels:
  - name: moon_haze
    tier: 2
    mt32_patch: 38         # MT-32 Atmosphere: slow, reverb-friendly LA color
    gm_program: 100        # GM FX 4 (Atmosphere)
    imfc_voice: "Fantasy"  # IMFC Fantasy (ROM5 synth pad; airy Atmosphere map)
    pan: center
    volume: 40
    velocity: 56
    events:
      - {at: 5, pattern: haze_ping}
      - {at: 37, pattern: haze_ping}

  # ── Tier 2: Theremin ambience (maintainer request — shadows ch2 exactly, two octaves below) ──
  - name: cave_theremin
    tier: 2
    mt32_patch: "Theremin"       # custom RCA-theremin timbre, timbres.yaml
    gm_program: 86               # GM Lead 6 (voice), 1-based (Tower fallback)
    imfc_voice: "Theremin"       # IMFC custom Theremin (bank 0; 1:1 custom-timbre map)
    pan: center
    volume: 46                   # background bed under the ch2 lead; ear will set final level
    velocity: 62
