  # --- Tier 2 (MT-32 / GM only; never OPL) --------------------------------
  # war_drums — timpani heartbeat, not a kit: low tom on every downbeat
  # plus kick on beat 3 inside the lyrical halves (hook mm. 3-10,
  # middles mm. 23-30), and a crash pickup into the loop corner. Under
  # the 16th runs only the downbeat tom sounds — drive without clutter.
  # Rides the enhancement stream (MIDI ch 10); GB ch4 stays empty so
  # in-battle SFX keep their channel. Body pattern instanced once at
  # m. 11; the compiler duplicates it to mm. 35-58, which puts the
  # m. 24 b. 4 crash pickup ahead of BOTH loop entries (m. 34->35 in
  # pass 1, m. 58->35 wrap after).
  - name: war_drums
    tier: 2
    rhythm: true
    pan: center
    mt32_volume: 74
    gm_volume: 74
    imfc_volume: 74
    velocity: 88
    events:
      - {at: 1, pattern: intro_drums}
      - {at: 11, pattern: body_drums}
      - {at: 35, pattern: body_drums}

  # --- Runs shadow -------------------------------------------------------
  # runs_drums — follows ONLY the scalar 16th runs (intro mm. 1-2, body
  # mm. 1-12 = song mm. 11-22, auto-duplicated to loop mm. 35-46): mid
  # tom on 8ths + kick on quarters, i.e. a half-time reduction of the
  # runs, not a 16th doubling (which would blur into them). Different
  # drum (47) from war_drums' downbeat tom (45) so the layers stay
  # separable; hook/lyrical/transitions get no shadow — war_drums'
  # heartbeat already covers those.
  - name: runs_drums
