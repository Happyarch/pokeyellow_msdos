                              # muffled-low-end complaint as Cities2 2026-09-11):
                              # MULT-2 octave sideband for pitch tracking
    mt32_patch: 31        # MT-32 Syn Bass 3 (detuned SAW+SQU, reso 15 — saw
                          # edge cuts through the runs; SynBass1's round
                          # sustainer vanished here. Fallback if the edge is
                          # wrong for battle low end: Acou Bass 1 (#65))
    gm_program: 39        # GM Synth Bass 1
