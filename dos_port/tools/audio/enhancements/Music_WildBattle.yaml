# enhancements/Music_WildBattle.yaml — tier-1 foundation (Phase E).
#
# The track (C major 0.699 vs C minor 0.558, changing every half-measure
# across 68 chord segs): ch1 scalar runs + hook, ch2 fifth-ostinatos,
# ch3 low ostinato, ch4 empty (battle-SFX reservation — no drums on the
# base track, ever). What is missing: low end (ch3 never drops below
# C4 territory in effect) and sustained harmonic glue (every GB voice
# moves). Two conservative tier-1 voices, both clear of the GB parts:
#
#   * sub_bass — chord roots in octave 1, one note per analysis chord
#     seg (half-measure rate through the chromatic runs, long pedals
#     under the islands: m29 C1 x16 beats). Roots ONLY: thirds flip
#     E/Eb within a beat here (m3 C->Cm, m7 C->Cm...), so any third
#     would clash; roots are ambiguity-proof. Follows the analysis
#     chord map verbatim (mm. 1-34 = intro + one loop body; the
#     compiler duplicates the body, so mm. 35-58 ride free).
#   * low_pad — one sustained note per chord seg in octave 2-3, root
#     or fifth whichever is nearer the previous pick (common tones
#     held through the ambiguity: G2 across C->Cm7->G7 mm. 16-18, C3
#     across the m29 pedal). No thirds, same reason. Single-note line
#     throughout, so the below-C3 spacing rule is trivially satisfied.
#
# Tier-2/3 intentionally absent for now: on MT-32 the pad cascades as
# Str Sect 1 already, and strings/timpani (the planned tier-2) get
# authored against the auditioned tier-1 balance, not before it.
# OPL patches sub_bass/soft_pad (gen_opl_patches.py); MT-32 SynBass1/
# Str Sect 1 cascade; GM Synth Bass 1 / Pad 2 (warm) to match.

schema: 1
song: Music_WildBattle

channels:
  - name: sub_bass
    tier: 1
    opl_patch: sub_bass_clear  # round sine had no attack definition under the
