# Music_SurfingPikachu — Pikachu's Beach surfing-minigame theme. Tier 1–3.
#
# E major, 4/4, 38 grid measures, loop at m23 b1 (frame 1930, end 3334).
# Intro = mm1-22, loop body = mm23-38 (a restatement of the intro's
# second-half material: m23=m7, m24=m8, m25=m9, m26=m10, m29=m13,
# m30=m14, m31-32=m15-16, m33-34=m17-18, m35-36=m31-32-shape, m37-38=m21-22).
# Authored literal throughout (no patterns for the pitched voices); the
# body is written out so the loop-return variant is honest.
#
# Base texture (pret_audio.AudioROM + gb_to_midi.simulate_song): only THREE
# channels, no noise. ch1 B3-E5 lower thematic line (238 notes), ch2 E4-E6
# melody (151 notes, peaks C#6 m21/m37, B5/E6 m22/m38), ch3 B3-E5 busy
# eighth-note accompaniment figure (302 notes). Harmony is a static,
# sunny I-ii-V-IV-vi loop (E, F#m/m7, Emaj7, B7, Amaj7, C#m7, D#dim,
# C#aug); the analysis' "C#aug" at m17/m33 sounds C# + F# + A (+C passing),
# so the pad takes A3 there, never E-natural against it.
#
# Register audit: the whole GB mix sits at MIDI 59 (B3) and above, and the
# E4-B4 band is saturated by all three channels at once. Two bands are
# empty: the bass floor below B3, and everything above C#6 (85). Octave 3
# below A3 (57) is also unison-free (base minimum is 59).
#
#   Tier 1 (OPL3 + MT-32/GM), light-route budget of 2:
#     surf_bass — chord roots in octave 2, one per half-measure change.
#                 The bounce the tiny speaker omitted; on MT-32/GM it is a
#                 round plucked acoustic bass, on OPL3 a pure sine floor.
#     sunny_pad — tenor 3rds/5ths/7ths in C3-A3 (never the root pitch-class
#                 the bass is on, so no parallel 8ves between the added
#                 voices; step/common-tone motion throughout). Cascades to
#                 MT-32 as real strings.
#   Tier 2 (MT-32/GM only):
#     beach_groove — rhythm channel (exempt from pitched rules): soft kick
#                 on 1 & 3, maracas on 2 & 4. The GB song has no noise at
#                 all, so this light backbeat is the main bounce source, and
#                 being MT-32/GM-side it never touches the GB noise channel
#                 SFX need. One 1-bar pattern instanced across all 38 bars.
#   Tier 3 (MT-32/GM only):
#     sun_glint — eight short pan-pipe pings (E6/F#6/A6, all above the C#6
#                 base ceiling) at the song open, the two D#dim/B7 turns,
#                 the C#aug peaks, the F#m climbs, and the loop return.
#                 Pan Pipes is unused elsewhere in the project and reads as
#                 sun-on-water; GM pairs it with Pan Flute. No custom timbre:
#                 JigglyVox/Sawtooth/Theremin/NightWind are all eerie or vocal
#                 and wrong for a sunny beach cue.
#
# Loop seam: every pitched note tiles half-measure to half-measure, so none
# crosses frame 1930; the m22 b3 bass/pad (C#2/E3, d2) end exactly on m23 b1.
# The groove blips (d<=0.4) and glints (d0.5) never touch a boundary.

