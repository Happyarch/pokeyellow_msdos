# Music_Routes1 — route theme (D major, 12 measures, loop from m1, no intro).
#
# Score-analysis identity: "Road to Viridian City - From Pallet Town"
# (MUSIC_ROUTES1 plays on ROUTE_1/2). Playful/chirpy D-major theme whose charm
# is syncopation: sq1 melody + wave bass are unsyncopated while sq2 interjects
# on the "and" of beats 1 and 3 and the noise ticks the off-beats. Harmony
# plays it safe (I-V for mm1-8, IV enters at m9); background passing/neighbor
# dissonances (chromatic wave bass, unstable square notes) are left alone —
# added voices stick to chord tones.
#
# Frame-exact note data: generated MIDI (gb_to_midi.py --target gm --songs
# Routes1 --no-enhance) parsed per channel, measures via
# analysis/Music_Routes1.yaml beat map (measure ~114 frames, half = ~57).
# GB ranges (MIDI numbers, C4=60): ch1 C#4(61)..G5(79), lyrical, rests m1b1;
# ch2 B4(71)..E6(88), dense 16th figuration mm1-8 (density 2.15), soaring
# descant mm9-12; ch3 (wave) A3(57)..D4(62), half-note steps mm1-8, whole
# notes mm9-12 (D4,G3,A3,C#4,D4,G3,A3,D4); ch4 noise id 15 off-beats.
# Chord halves (H1..H24, from analysis): D Bm | D A | A A | A D | D D | Bm D |
# D A | A A | A A | A D | D D | G | Bm A | D G | Bm D  (mm1-8 I-V, mm9-12 IV).
#
# Tier 2 (route-theme foundation — promoted off OPL3 per audition, which
# plays the pure GB trio now; MT-32/GM unchanged):
#   * sub_bass — chord roots in octave 1-2, one sustained note per harmony
#     half-measure. The deep foundation Masuda's tiny-speaker mix omits.
#   * low_pad — sustained chord 3rds/5ths in C3..F#3, voice-led by step with
#     long common-tone holds (F#3 across D/Bm/D, E3 across the A stretches),
#     D3 as the G-major 5th (its 3rd B2 is fine too but D3 keeps the line in
#     C3+ and moves F#3->D3 by 3rd), closing H24 on F#3 so the loop seam is
#     a seamless hold into H1. Every pad pitch was checked against the exact
#     wave/ch1/ch2 timing: pad max F#3(54) vs wave min A3(57), ch1 min
#     C#4(61) — zero unison collisions by construction (mm10-11 C#3/D3 pad
#     notes sit an octave below wave's C#4/D4, which is permitted).
#
# (No tier-1 voices remain. The old tier-skip note is retired: the midrange
# is still fully packed, which is why nothing new was ADDED in tier 2 —
# the promoted foundation just lives here now.)
#
# Tier 2 holds the promoted foundation (see above) — nothing was added in
# the packed midrange; forcing a string pad there would be unison roulette
# against the 16th figuration (PalletTown shape: foundation + tier-3 chime).
#
# Tier 3 (MT-32/GM only): one sparse celesta chime on phrase downbeats,
# octave 6, marking the form (m1/m5/m9 downbeats + final H24), all checked
# against ch2's descant (D6/E6/C#6 in mm11-12): D6 at m1b1/m5b1/m9b1 sits
# over ch2's D5/F#5 (octave, permitted), A5 at m12b3 closes on the Dmaj7
# 5th while ch2 holds D5.

schema: 1
song: Music_Routes1

channels:
# IMFC pass: imfc_voice added per channel below; imfc_volume intentionally
# omitted — the merge falls back to legacy `volume`, and an explicit
# imfc_volume beside `volume` is a yaml_lint ERROR (mixing rule).
  - name: sub_bass
    tier: 2
    mt32_patch: 29        # MT-32 Syn Bass 1 (round, sustaining)
    gm_program: 39        # GM Synth Bass 1
    imfc_voice: "EBass"   # IMFC E.Bass (bass family; PalletTown precedent)
    pan: center
    volume: 56
    velocity: 76
    events:
      - {m: 1,  b: 1, d: 2,   n: D2}   # H1  Dmaj7 (I7)
      - {m: 1,  b: 3, d: 2,   n: B1}   # H2  Bm7 (vi7)
      - {m: 2,  b: 1, d: 2,   n: D2}   # H3  Dmaj7
      - {m: 2,  b: 3, d: 8,   n: A1}   # H4-H7  A7/A (V)
      - {m: 4,  b: 3, d: 4,   n: D2}   # H8-H9  Dmaj7
      - {m: 5,  b: 3, d: 2,   n: B1}   # H10 Bm7
      - {m: 6,  b: 1, d: 2,   n: D2}   # H11 D (I)
      - {m: 6,  b: 3, d: 8,   n: A1}   # H12-H15 A7/A
      - {m: 8,  b: 3, d: 4,   n: D2}   # H16-H17 D
      - {m: 9,  b: 3, d: 2,   n: G1}   # H18 G (IV)
      - {m: 10, b: 1, d: 2,   n: B1}   # H19 Bm7
      - {m: 10, b: 3, d: 2,   n: A1}   # H20 A7
      - {m: 11, b: 1, d: 2,   n: D2}   # H21 Dmaj7
      - {m: 11, b: 3, d: 2,   n: G1}   # H22 G
      - {m: 12, b: 1, d: 2,   n: B1}   # H23 Bm7
      - {m: 12, b: 3, d: 1.9, n: D2}   # H24 Dmaj7; d1.9 releases just
                                       # before the loop seam (PalletTown
                                       # precedent: final frame not
                                       # beat-addressable)

  - name: low_pad
    tier: 2
    mt32_patch: 49        # MT-32 Str Sect1 (warm string pad)
    gm_program: 90        # GM Pad 2 (warm)
    imfc_voice: "Strings" # IMFC Strings (PalletTown precedent)
    pan: center
    volume: 70
    velocity: 82
    events:
      - {m: 1,  b: 1, d: 6,   n: F#3}  # H1-H3  D/Bm7/D 3rd/5th/3rd (hold)
      - {m: 2,  b: 3, d: 8,   n: E3}   # H4-H7  A7/A 5th (F#->E step)
      - {m: 4,  b: 3, d: 8,   n: F#3}  # H8-H11 D/D/Bm/D (E->F# step)
      - {m: 6,  b: 3, d: 8,   n: E3}   # H12-H15 A7/A (step down)
      - {m: 8,  b: 3, d: 4,   n: F#3}  # H16-H17 D (step up)
      - {m: 9,  b: 3, d: 4,   n: D3}   # H18-H19 G/Bm7 5th/3rd (hold)
      - {m: 10, b: 3, d: 2,   n: C#3}  # H20 A7 3rd (D->C# step)
      - {m: 11, b: 1, d: 6,   n: D3}   # H21-H23 D/G/Bm root/5th/3rd
      - {m: 12, b: 3, d: 1.9, n: F#3}  # H24 Dmaj7 3rd; seamless into H1

  - name: sparkle
    tier: 3               # color/flourish — dropped first under pressure
    mt32_patch: 23        # MT-32 Celesta 1
    gm_program: 9         # GM Celesta
    imfc_voice: "Celeste" # IMFC Celeste (PalletTown precedent)
    pan: center
    volume: 64
    velocity: 80
    events:
      - {m: 1,  b: 1, d: 1, n: D6}   # top of form (ch2 has D5 — octave ok)
      - {m: 5,  b: 1, d: 1, n: D6}   # second-strain downbeat
      - {m: 9,  b: 1, d: 1, n: D6}   # lyrical-section downbeat
      - {m: 12, b: 3, d: 1, n: A5}   # Dmaj7 5th, turn back to the loop
