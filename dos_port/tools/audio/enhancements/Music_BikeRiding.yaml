# Music_BikeRiding — Cycling theme. Tier 1–3 enhancement (Phase E).
#
# C major, 4/4, tempo 144. The engine file is audio/music/bikeriding.asm:
# an eighth-note pickup (ch1 G4 + ch2 C5) then a 19-measure AB loop
# (.mainloop). analysis/Music_BikeRiding.yaml covers pickup + first
# statement + one more loop body (39 grid measures, loop at m20 b1.48
# = frame 2065). Melody is ch2 (C5–E6); ch1 is the answering line
# (G4–A5); ch3 is the bouncy off-beat wave ostinato (G3–C5); ch4 is
# the continuous off-beat noise the score analysis calls out.
#
# Score analysis (user-supplied Cycling note; not in the transcriptions
# tree): binary AB. A is nine measures of flowing melody, then an
# eighth-note imitation that lands a half cadence on V in m8–9. B
# (rehearsal 1 = analysis m10) is sequences — descending in m10–11,
# ascending in m16–17 — peaking at m18 where the harmonic rhythm
# halves. Both halves tonicize IV via V7/IV (C7): m4 resolves to F
# (IV), m15 slips deceptively to Dm (ii). Do not "correct" that.
#
# Register gap: nothing in the GB mix sits below G3 (wave floor).
# Ch1/ch2 pack G4–E6; ch3 saturates G3–C5 with eighths, so a sustained
# mid pad there unison-collides. The empty band is the whole low end
# below G3 — the foundation the tiny speaker omitted.
#
#   Tier 1 (OPL3 + MT-32/GM), route-theme budget of 2:
#     bike_bass  — chord roots in octave 2, one note per structural
#                  change. Grounds the bounce without doubling it.
#     breeze_pad — tenor in C3–E3 on the 3rd (or 5th when the 3rd is
#                  the wave's floor). Stepwise, long common tones.
#                  Never the same pitch-class as the bass (no parallel
#                  8ves between the two added voices).
#
#   Tier 2 (MT-32/GM only):
#     wind_horn  — French horn, B section only (m10–19 / m29–38). FM
#                  cannot do a bowed brass swell; this is the "wind in
#                  your hair" layer. Rests through A and the HC so the
#                  half cadence stays thin and the form still reads.
#
#   Tier 3 (MT-32/GM only):
#     road_harp  — short chord-tone twinkles ABOVE the melody (F6–A6)
#                  at the IV arrivals, the B-section downbeat, the
#                  rising sequence, and the m18 peak. Scenery flashing
#                  by; not a music box.
#
# Loop seam: no note may cross frame 2065 (gen_enh_streams.py skips
# the song if one does). Shared material is the 18-measure stretch
# m2–19 ≡ m21–38, instanced twice. Pickup / first-bar C, the 0.48-beat
# G tail into the loop, and the loop-return C head are written literal
# so the first-time and loop-return variants stay honest.
#
# Authority: notes and loop point from the analysis / pret source, not
# the prose description. Chord labels below follow the analysis except
# where the description + sounding pitches agree the template missed
# the function (m15 = V7/IV not Edim; m18–19 = V pedal, not Cmaj7/Baug).

schema: 1
song: Music_BikeRiding

channels:
  # ── Tier 1 ────────────────────────────────────────────────────────────────
  - name: bike_bass
    tier: 1
    opl_patch: sub_bass          # pure sine; sits under the pulse shim
    mt32_patch: 29               # SynBass1 (round, sustaining)
    gm_program: 39               # Synth Bass 1
    pan: center
    volume: 62
    velocity: 80
    events:
      - {m: 1, b: 1, d: 4, n: C2}           # pickup + I (A opens)
      - {at: 2,  pattern: bass_body}
      - {m: 20, b: 1, d: 0.48, n: G2}       # V tail — must end at the loop
      - {m: 20, b: 1.48, d: 3.52, n: C2}    # loop-return I (no pickup)
      - {at: 21, pattern: bass_body}
      - {m: 39, b: 1, d: 0.48, n: G2}       # V tail, shaved for song-end

  - name: breeze_pad
    tier: 1
    opl_patch: soft_pad          # organ-like FM warmth, not strings
    mt32_patch: 49               # Str Sect 1 — cascades as real strings on MT-32
    gm_program: 90               # Pad 2 (warm)
    pan: center
    volume: 58
    velocity: 76
    events:
      - {m: 1, b: 1, d: 4, n: E3}           # I, 3rd
      - {at: 2,  pattern: pad_body}
      - {m: 20, b: 1, d: 0.48, n: D3}       # V, 5th
      - {m: 20, b: 1.48, d: 3.52, n: E3}    # loop-return I, 3rd
      - {at: 21, pattern: pad_body}
      - {m: 39, b: 1, d: 0.48, n: D3}

  # ── Tier 2 ────────────────────────────────────────────────────────────────
  # Cascaded tier-1 pad is already the string tenor on MT-32, so do not
  # add another mid pad. Horn is the thing FM cannot do: a slow brass
  # swell that reads as wind. B section only — A stays the light ride.
  - name: wind_horn
    tier: 2
    mt32_patch: 93               # Fr Horn 1
    gm_program: 61               # French Horn
    pan: left
    volume: 52
    velocity: 72
    events:
      - {at: 10, pattern: horn_b}
      - {at: 29, pattern: horn_b}

  # ── Tier 3 ────────────────────────────────────────────────────────────────
  - name: road_harp
    tier: 3
    mt32_patch: 58               # Harp 1
    gm_program: 47               # Orchestral Harp
    pan: right
    volume: 56
    velocity: 78
    events:
      - {at: 1,  pattern: harp_body}
      - {at: 20, pattern: harp_body}

patterns:
  # m2–19 ≡ m21–38. Roots only; seventh-quality changes that share a
  # root (C/Cmaj7/C7, Dm/Dm7, G/G7) stay put. m15 is C (V7/IV), not
  # the analysis' Edim — same C7 that resolved to IV in m4, here going
  # deceptively to ii. m18–19 is the G pedal the squares actually hold.
  bass_body:
    measures: 18
    events:
      - {m: 1,  b: 1, d: 2, n: C2}    # Cmaj7 (I7)
      - {m: 1,  b: 3, d: 2, n: F2}    # Fmaj7 (IV7)
      - {m: 2,  b: 1, d: 4, n: D2}    # Dm / Dm7 (ii)
      - {m: 3,  b: 1, d: 4, n: C2}    # Cmaj7 / C7 (I → V7/IV)
      - {m: 4,  b: 1, d: 4, n: F2}    # Fmaj7 (IV) — V7/IV resolves
      - {m: 5,  b: 1, d: 2, n: C2}    # Cmaj7 (I)
      - {m: 5,  b: 3, d: 2, n: E2}    # Em7 (iii)
      - {m: 6,  b: 1, d: 2, n: A2}    # Am7 (vi)
      - {m: 6,  b: 3, d: 2, n: D2}    # Dm7 (ii)
      - {m: 7,  b: 1, d: 4, n: G2}    # G7 / G (V) — HC approach
      - {m: 8,  b: 1, d: 4, n: G2}    # G7 (V7) — HC, stay thin
      - {m: 9,  b: 1, d: 4, n: D2}    # Dm7 (ii) — B section, desc. seq.
      - {m: 10, b: 1, d: 2, n: C2}    # Cmaj7 (I)
      - {m: 10, b: 3, d: 2, n: E2}    # Em7 (iii)
      - {m: 11, b: 1, d: 2, n: D2}    # Dm7 (ii)
      - {m: 11, b: 3, d: 2, n: G2}    # G7 (V)
      - {m: 12, b: 1, d: 4, n: C2}    # Cmaj7 (I)
      - {m: 13, b: 1, d: 4, n: F2}    # F (IV)
      - {m: 14, b: 1, d: 4, n: C2}    # C7 (V7/IV) — will not go to F
      - {m: 15, b: 1, d: 2, n: D2}    # Dm7 (ii) — deceptive
      - {m: 15, b: 3, d: 2, n: E2}    # Em7 (iii) — asc. seq. starts
      - {m: 16, b: 1, d: 2, n: F2}    # Fmaj7 (IV)
      - {m: 16, b: 3, d: 2, n: D2}    # D7 (V7/V)
      - {m: 17, b: 1, d: 4, n: G2}    # G (V) — climax
      - {m: 18, b: 1, d: 4, n: G2}    # G pedal into the seam

  # 3rd where it sits in C3–E3; 5th when the 3rd is G3 (wave floor) or
  # would unison the bass. Inner-voice motion is step / common-tone;
  # the one 3rd-leap (F# avoided — D7 keeps D3 so ti does not need G3).
  pad_body:
    measures: 18
    events:
      - {m: 1,  b: 1, d: 2, n: E3}    # Cmaj7 3rd (held from m1)
      - {m: 1,  b: 3, d: 2, n: C3}    # Fmaj7 5th
      - {m: 2,  b: 1, d: 4, n: F3}    # Dm 3rd
      - {m: 3,  b: 1, d: 4, n: E3}    # C / C7 3rd
      - {m: 4,  b: 1, d: 4, n: C3}    # F 5th
      - {m: 5,  b: 1, d: 4, n: E3}    # C 3rd → Em root (common tone)
      - {m: 6,  b: 1, d: 2, n: E3}    # Am 5th
      - {m: 6,  b: 3, d: 2, n: F3}    # Dm 3rd
      - {m: 7,  b: 1, d: 4, n: D3}    # G 5th (3rd is B, 7th would hang)
      - {m: 8,  b: 1, d: 4, n: D3}    # G7 5th — HC, no extra 7th
      - {m: 9,  b: 1, d: 4, n: F3}    # Dm 3rd
      - {m: 10, b: 1, d: 4, n: E3}    # C 3rd / Em root
      - {m: 11, b: 1, d: 2, n: F3}    # Dm 3rd
      - {m: 11, b: 3, d: 2, n: D3}    # G 5th
      - {m: 12, b: 1, d: 4, n: E3}    # C 3rd
      - {m: 13, b: 1, d: 4, n: C3}    # F 5th
      - {m: 14, b: 1, d: 4, n: E3}    # C7 3rd
      - {m: 15, b: 1, d: 2, n: F3}    # Dm 3rd
      - {m: 15, b: 3, d: 2, n: E3}    # Em root
      - {m: 16, b: 1, d: 2, n: C3}    # F 5th
      - {m: 16, b: 3, d: 2, n: D3}    # D7 root (avoid F#→G3 unison)
      - {m: 17, b: 1, d: 4, n: D3}    # G 5th (common tone)
      - {m: 18, b: 1, d: 4, n: D3}    # G 5th

  # B-section horn. Independent of the pad (different chord tone every
  # change). C7's Bb resolves down to A on the deceptive ii. Parallel
  # 5ths with the bass on Em→F and Em→Dm are avoided by taking the 3rd
  # (A2) of F and the root-octave (D3) of Dm instead of the 5th.
  horn_b:
    measures: 10
    events:
      - {m: 1,  b: 1, d: 4, n: A2}    # Dm 5th
      - {m: 2,  b: 1, d: 2, n: C3}    # C root at 8'
      - {m: 2,  b: 3, d: 2, n: B2}    # Em 5th
      - {m: 3,  b: 1, d: 2, n: D3}    # Dm root at 8' (A2 would P5-parallel)
      - {m: 3,  b: 3, d: 2, n: B2}    # G 3rd
      - {m: 4,  b: 1, d: 4, n: C3}    # C root at 8'
      - {m: 5,  b: 1, d: 4, n: A2}    # F 3rd (C3 would unison the pad)
      - {m: 6,  b: 1, d: 4, n: Bb2}   # C7 7th
      - {m: 7,  b: 1, d: 8, n: A2}    # Dm 5th → Em sus4 → F 3rd → D7 5th
                                      # (one common tone; Em's B2 was a P5
                                      #  parallel with the bass D2–E2 climb)
      - {m: 9,  b: 1, d: 4, n: B2}    # G 3rd — climax
      - {m: 10, b: 1, d: 4, n: B2}    # G 3rd

  # Octave-6 chord tones, well above ch2's E6 ceiling. Short on purpose.
  harp_body:
    measures: 19
    events:
      - {m: 5,  b: 1, d: 0.5, n: F6}  # IV arrival (V7/IV resolved)
      - {m: 10, b: 1, d: 0.5, n: F6}  # B section / desc. seq. (Dm 3rd)
      - {m: 14, b: 1, d: 0.5, n: F6}  # IV
      - {m: 17, b: 1, d: 0.5, n: F6}  # IV, rising sequence
      - {m: 17, b: 3, d: 0.5, n: A6}  # D7 5th — the climb
      - {m: 18, b: 1, d: 1,   n: G6}  # V, the peak
