# Music_Surfing — Surf / Ocean overworld cue. Tier-1 + tier-3 enhancement.
#
# Authored against analysis/Music_Surfing.yaml (frame-exact) and the user's
# Ocean score-analysis description. The generated authoring grid is 14
# measures of 4/4 (30 frames per beat), with a MID-MEASURE loop at m2 b3.5:
# loop_start 195, end 1635, period 1440 frames. The score's compound/triple
# water sway remains in the three-note GB figures; YAML timing follows the
# analysis grid, which is authoritative for musical positions.
#
# Register audit from pret_audio.AudioROM + gb_to_midi.simulate_song:
# ch1 E3..D5, ch2 E4..C#6, ch3 A3..E5. In the repeating body, ch1 stays
# E4..D5 and ch2 stays B4..C#6, while the wave's triplet figure only dips to
# A3/B3. The entire bass register is therefore empty, and C#3..G#3 is mostly
# open once the first-time intro's low ch1 notes have passed.
#
# The quiet water/route texture gets only two tier-1 voices:
#   * ocean_bass — slow octave-2 roots, supplying the bass floor the GB mix
#                  lacks without copying the high wave figure.
#   * undercurrent — one sustained chord-tone line, mostly octave 3. It uses
#                    step/common-tone motion and rests nowhere the whole GB
#                    trio rests (the trio is continuously sounding).
# Tier 2 is deliberately absent: undercurrent already cascades to MT-32 as
# strings, and another sustained mid pad would crowd ch1/ch3. Tier 3 is only
# five short celesta glints at the four A/A'/B/B' phrase opens and the E7
# loop turn — water sparkle, not a motoric music-box layer. No rhythm channel:
# Surf field-move SFX need the GB noise channel, and the original has none.
#
# Modified loop treatment: repeated_spans is empty, so the unique loop body
# is written once rather than forced into a pattern. First-time material is
# literal through m2 b3.5. The A bass/pad at m2 b3 are split exactly at the
# 195-frame loop point; m14's shortened final beat uses d2.99 so its A/E
# tail rounds exactly to frame 1635, then returns to the separately keyed
# m2 b3.5 head. No enhancement note crosses the loop.

schema: 1
song: Music_Surfing

channels:
  # ── Tier 1: OPL3 foundation (also cascades to MT-32 / GM) ────────────────
  - name: ocean_bass
    tier: 1
    opl_patch: sub_bass          # clean sine floor beneath the high GB wave
    mt32_patch: 29               # MT-32 SynBass1
    gm_program: 39               # GM Synth Bass 1
    pan: center
    volume: 54
    velocity: 74
    events:
      # First-time intro. The final A fragment is split at loop_start.
      - {m: 1, b: 1,   d: 2,   n: A2}   # Amaj7
      - {m: 1, b: 3,   d: 4,   n: E2}   # E -> E7, one dominant pedal
      - {m: 2, b: 3,   d: 0.5, n: A2}   # Amaj7, first-time side of seam

      # Loop body, m2 b3.5 through m14 b3.5.
      - {m: 2,  b: 3.5, d: 1.5, n: A2}  # Amaj7, loop-return head
      - {m: 3,  b: 1,   d: 6,   n: E2}  # E7 prolongation
      - {m: 4,  b: 3,   d: 2,   n: F#2} # F#m7
      - {m: 5,  b: 1,   d: 6,   n: A2}  # A -> Amaj7
      - {m: 6,  b: 3,   d: 4,   n: E2}  # E7 -> E
      - {m: 7,  b: 3,   d: 2,   n: F#2} # F#m7
      - {m: 8,  b: 1,   d: 2,   n: A2}  # A
      - {m: 8,  b: 3,   d: 2,   n: B2}  # Bm7
      - {m: 9,  b: 1,   d: 2,   n: F#2} # F#m7
      - {m: 9,  b: 3,   d: 2,   n: A2}  # Amaj7
      - {m: 10, b: 1,   d: 2,   n: C#2} # C#m7
      - {m: 10, b: 3,   d: 2,   n: E2}  # Emaj7
      - {m: 11, b: 1,   d: 2,   n: A2}  # Amaj7
      - {m: 11, b: 3,   d: 2,   n: B2}  # Bm7
      - {m: 12, b: 1,   d: 2,   n: F#2} # F#m7
      - {m: 12, b: 3,   d: 2,   n: A2}  # Amaj7
      - {m: 13, b: 1,   d: 2,   n: E2}  # E7 — loop turn begins
      - {m: 13, b: 3,   d: 2,   n: C#2} # C#m7
      - {m: 14, b: 1,   d: 2.99, n: A2} # Amaj7 -> A; short final beat ends at 1635

  - name: undercurrent
    tier: 1
    opl_patch: soft_pad          # quiet organ-like FM warmth
    mt32_patch: 49               # MT-32 Str Sect 1 on the cascaded tier
    gm_program: 90               # GM Pad 2 (warm)
    pan: center
    volume: 56
    velocity: 72
    events:
      # Intro voicings avoid ch1's first-time A3-G#3-F#3-E3 descent.
      - {m: 1, b: 1,   d: 2,   n: E3}   # Amaj7 5th
      - {m: 1, b: 3,   d: 4,   n: B3}   # E/E7 5th, held common tone
      - {m: 2, b: 3,   d: 0.5, n: E3}   # Amaj7 5th, first-time seam side

      # Loop body. A-before-Bm rises to C#4 so the following F#3 does not
      # create parallel fifths with the A2->B2 bass motion. Bm->F#m moves
      # contrary to A3 for the same reason.
      - {m: 2,  b: 3.5, d: 1.5, n: E3}  # Amaj7 5th, loop-return head
      - {m: 3,  b: 1,   d: 6,   n: G#3} # E7 3rd
      - {m: 4,  b: 3,   d: 2,   n: F#3} # F#m7 root at the octave
      - {m: 5,  b: 1,   d: 6,   n: E3}  # A/Amaj7 5th
      - {m: 6,  b: 3,   d: 4,   n: G#3} # E7/E 3rd
      - {m: 7,  b: 3,   d: 2,   n: A3}  # F#m7 3rd
      - {m: 8,  b: 1,   d: 2,   n: C#4} # A 3rd
      - {m: 8,  b: 3,   d: 2,   n: F#3} # Bm7 5th
      - {m: 9,  b: 1,   d: 2,   n: A3}  # F#m7 3rd
      - {m: 9,  b: 3,   d: 4,   n: E3}  # Amaj7 5th -> C#m7 3rd
      - {m: 10, b: 3,   d: 2,   n: G#3} # Emaj7 3rd
      - {m: 11, b: 1,   d: 2,   n: C#4} # Amaj7 3rd
      - {m: 11, b: 3,   d: 2,   n: F#3} # Bm7 5th
      - {m: 12, b: 1,   d: 2,   n: A3}  # F#m7 3rd
      - {m: 12, b: 3,   d: 2,   n: E3}  # Amaj7 5th
      - {m: 13, b: 1,   d: 2,   n: G#3} # E7 3rd
      - {m: 13, b: 3,   d: 4.99, n: E3} # C#m7 3rd -> A 5th; exact rounded end

  # ── Tier 3: sparse LA/GM-only surface glints ─────────────────────────────
  - name: surface_glint
    tier: 3
    mt32_patch: 23               # MT-32 Celesta 1
    gm_program: 9                # GM Celesta
    pan: right
    volume: 48
    velocity: 68
    events:
      - {m: 2,  b: 3.5, d: 0.5, n: A5}  # A phrase / loop-body open
      - {m: 5,  b: 3.5, d: 0.5, n: A5}  # A' open
      - {m: 8,  b: 3.5, d: 0.5, n: F#6} # B open; common to sounding F#m/Bm7
      - {m: 11, b: 3.5, d: 0.5, n: F#6} # B' open
      - {m: 13, b: 1,   d: 0.5, n: B5}  # E7 5th; turn, not a final cadence
