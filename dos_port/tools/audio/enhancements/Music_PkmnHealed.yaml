# Music_PkmnHealed — Pokemon Center healing-machine jingle. Tier 1 + tier 3
# enhancement (Phase E).
#
# Authored against analysis/Music_PkmnHealed.yaml (frame-exact) and the
# game-specific score-analysis description
# (docs/references/pokemon_score_transcriptions/descriptions/pokemon_center_recovery.md),
# per the audio-enhance-opl3 / audio-enhance-mt32 / music-theory skills.
#
# The track: E major (analysis K-S 0.868, unambiguous), ONE static I chord
# for the whole jingle, no loop (sound_ret, 135 frames / 5 beats: m1 b1
# through m2 b2). Sim registers (MIDI naming, C4 = 60): ch1 is the low
# B2/E2 arpeggio (B2 B2 E2 ... E2 B2) whose pitch_slides the MIDI path
# drops (gb_to_midi.py: timbre/expression, no MIDI v1) — supplementary
# SFX contour, never doubled; ch2 is the melody (B5 B5 B5 G#5, then a
# long E6); ch3 is the wave pulse (E4 E4 E4 G#4, then E4 [81-121]).
# Final sonority: B2 + E6 + E4 converging on E major.
#
# Skill table: fanfares/jingles are already dense — light reinforcement
# at most, full chord voicing for the climactic moment. Every GB triad
# tone is saturated in octaves 2/4/5/6; the one empty band is octave 3.
#
#   Tier 1 (OPL3 + MT-32/GM) — the one allowed voice:
#     heal_swell — open fifth [E3, B3] in the empty octave-3 band: a
#                whole-bar swell under m1, re-attacked at m2 b1 for the
#                climax. Started life as a full E-major triad, but the
#                G#3 third sat directly over ch1's B2/E2 bass line and
#                masked it on FM (user audition 2026-09-10) — the third
#                was cut, leaving root+5th. Octave (never unison)
#                against ch1's E2/B2 below and ch3's E4 above; oblique
#                against the ch2 melody two-plus octaves up. No D#
#                anywhere, so no leading-tone doubling hazard exists.
#
#   Tier 2: deliberately absent. The cascaded tier-1 swell is already
#           the MT-32 string tenor (patch 49), and a 5-beat one-shot
#           has no room for a second sustained layer (same proven
#           Pokecenter situation).
#
#   Tier 3 (MT-32/GM only):
#     heal_chime — full E-major voicing [E5, G#5, B5] struck once at the
#                  m2 b1 climax (frames 108–135), the 8ve/3rd/5th under
#                  the melody's final E6. FM cannot do celesta. Placed
#                  where ch2's B5/G#5 have already ended (no overlap, no
#                  unison); ch3's E4/G#4 sit an octave below (fine).
#
# One-shot: no loop seam to respect (loop: null). The 5-beat statement
# *is* the whole song, so one instance of each pattern.
#
# Voice leading (added vs GB, structural tones):
#   Swell E3/G#3/B3 holds through m1 while ch1 walks B2→B2→E2 (octave
#   doublings, oblique) and ch3 pulses E4/G#4 (octaves). At m2 b1 the
#   re-attack coincides with ch1's final B2 and ch2's held E6: root+5th
#   under a tonic arrival, no similar motion into a perfect (the only
#   perfects are pre-existing octaves). Chime E5/G#5/B5 at m2 b1 sits a
#   6th/3rd/4th under the melody E6 — no perfects, resolves nowhere
#   because the jingle simply stops (tonic arrival, not a cadence).

schema: 1
song: Music_PkmnHealed

channels:
  - name: heal_swell
    tier: 1
    opl_patch: soft_pad       # organ-like FM warmth; not a pulse
    mt32_patch: 49            # MT-32 Str Sect 1 (cascades as real strings)
    gm_program: 90            # GM Pad 2 (warm)
    imfc_voice: "Strings"     # IMFC Strings (strings precedent: PalletTown low_pad)
    pan: center
    volume: 48                # under the GB trio — reinforcement, not a lead
    velocity: 54              # tamed twice for OPL3 (TL math runs off
                              # vel*volume); MT-32 keeps its CC7 body,
                              # slightly softer attack
    events:
      - {at: 1, pattern: swell_body}

  # --- Tier 3 (MT-32 / GM only; never OPL) --------------------------------
  - name: heal_chime
    tier: 3                   # color — dropped first under polyphony
    mt32_patch: 23            # MT-32 Celesta 1 (factory idx 22, 1-based 23)
    gm_program: 9             # GM Celesta
    imfc_voice: "Celeste"     # IMFC Celeste (bells precedent: PalletTown sparkle)
    pan: center
    volume: 64                # a glint on the climax, not a section
    velocity: 80
    events:
      - {at: 2, pattern: chime_body}

patterns:
  # E-major root+5th in the empty octave-3 band. Whole-bar swell under
  # m1, re-attacked at m2 b1 for the climax arrival.
  swell_body:
    measures: 2
    events:
      - {m: 1, b: 1, d: 4, n: [E3, B3]}       # under the arpeggio + melody
      - {m: 2, b: 1, d: 0.9, n: [E3, B3]}     # climax: open fifth under E6

  # Full E-major voicing struck once at the climax.
  chime_body:
    measures: 1
    events:
      - {m: 1, b: 1, d: 0.9, n: [E5, G#5, B5]}   # 8ve/3rd/5th under melody E6
