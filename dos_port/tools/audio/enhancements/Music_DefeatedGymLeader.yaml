# enhancements/Music_DefeatedGymLeader.yaml - gym-leader victory sting.
#
# Sibling template (Music_DefeatedTrainer/WildMon): 2 tier-1 voices -
# sub_bass roots + low_pad 3rd/5th, no tier 3 (looping sting; a chime accent
# would fire every pass), plus one tier-2 RHYTHM voice (user request):
# ceremonial victory drums - low-tom quarters + kick, crashes on section
# downbeats, snare fill across the loop seam. Rests the 2-bar intro (first
# pass only), joins at the m3 loop entry and drives every pass after.
# Static-loop note: body content is identical every pass, so drums cannot
# sit out body-pass-1 and join pass 2 - the intro rest is the only
# first-pass-only space, and the seam fill is the end-of-iteration accent.
# Authored against
# music_analysis.py Music_DefeatedGymLeader (D major 0.88, 26 measures, loop
# m3) and victory_gym_leader.md (binary A A' B B' B B'', I-V/V-V-I B section).
#
# Register audit (YAML octaves are MIDI octaves, C4 = 60; verified with
# simulate_song: 413 base notes, floor A3 (57) at mm11/15/19/23 - the ch1
# low fanfare dips. Bass octave 2 (max A2 = 45) clears everything. Pad
# 3rds/5ths in octave 3: A3 sounds only at m2/m6/m16 (floors 69/59/61, no
# 57 present); every D-major bar takes F#3, stepping around the A3 pedal.
# No chord 7ths in the pad (Trainer-sting discipline). No timed switches.
# Loop body written out explicitly mm1-26.
