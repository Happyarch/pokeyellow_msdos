# the bumbling-villain reed — and differentiates this cue from Evil's
# darker Oboe ch2 within the villain family. ch1 untouched: the sq3
# stabs + whole-bar D4 need their 8-bit bite. ch3 untouched: the wave
# D-A/D#-A# ostinato stays chip. One base-voice change (Rival/ProfOak
# restraint). GM Bassoon to match per-target. No noise channel, no drums:.
channels:
  2:
    mt32_program: "Bassoon"   # comic-menace motto reed (Evil's Oboe stays darker)
    gm_program: "Bassoon"
    imfc_program: "Bassoon"   # IMFC Bassoon (bank 4 orchestral reed, 1:1 reed map)
    mt32_volume: 102               # melody carries
    gm_volume: 102
    imfc_volume: 102
    pan: 64
