# Music_MeetMaleTrainer — per-song MIDI overrides (see overrides/README.md).
#
# Encounter! Boy Trainer (MUSIC_MEET_MALE_TRAINER: the default "trainer spots
# you" stinger; female classes divert to MeetFemaleTrainer — home/trainers.asm).
# Ch1+ch2 (both duty-3 squares) split ONE composite chromatic line (the
# description's F#-D-E-C# exchange: ch1 holds the F# bar, ch2 the D-E middle),
# so they share one patch to sound like a single voice; ch3's E-B fifth
# ostinato gets bell body. Mirrors the MeetFemaleTrainer override exactly —
# the pair must sound like siblings, not strangers (leitmotif constraint).
channels:
  1:
    mt32_program: "Square Wave"   # composite-line half; stays 8-bit-sharp
    gm_program: "Lead 1 (square)"
    volume: 100
    pan: 52
  2:
    mt32_program: "Square Wave"   # composite-line half; melody carries
    gm_program: "Lead 1 (square)"
    volume: 104
    pan: 76
  3:
    mt32_program: "Warm Bell"     # fifth-ostinato attack + sustain body
    gm_program: "Music Box"
    volume: 92
    pan: 64
