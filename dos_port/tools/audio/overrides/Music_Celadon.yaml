# Music_Celadon — per-song MIDI overrides (see README.md for schema).
#
# Motivating bug (user audition 2026-07-07): square 2 gets lost in the mix
# across the loop. Root cause is patch choice: the GM-numbered placeholder
# defaults select MT-32 FACTORY patches (timbres.yaml uploads none yet), so
# program 80 = "Sax 3" for BOTH squares (identical timbre — sq2 vanishes
# wherever the lines cross or move in homophony, which per the score
# analysis is most of the A section) and 38 = "Warm Bell", whose long
# decay + hall reverb washes over the squares.
#
# Choices follow Masuda's own separation principle (score analysis,
# celadon_city.md): distinct instrument family per line. Names resolve via
# tools/audio/mt32_presets.py (MT-32 factory bank / GM level 1).
channels:
  1:
    mt32_program: "Square Wave"   # keep the chip-lead character on sq1
    imfc_program: "Wave"          # raw-wave ROM voice, chip-lead character
    pan: 44                       # sq1 slightly left / sq2 slightly right
    switches:                     # DEMO paired with the ch2 swap: sq1 turns
                                  # lyrical at rehearsal 2 (sustained B-G-D-G
                                  # line), so it gets breath (Flute 1) while
                                  # ch2 gets bow (Violin 1) — family contrast
                                  # preserved inside the B section. Both points
                                  # verified as exact ch1 note edges.
      - {m: 2, b: 1, mt32_program: "Square Wave", gm_program: "Lead 1 (square)", imfc_program: "Wave"}
      - {m: 10, b: 1, mt32_program: "Flute 1", gm_program: "Flute", imfc_program: "Flute"}
  2:
    mt32_program: "Doctor Solo"   # resonant synth lead, different family
                                  # from sq1 so the contrary-motion /
                                  # independent line (rehearsal 2) reads
                                  # as its own voice (kept per audition —
                                  # the trumpet swap was reverted)
    imfc_program: "SynLead"       # resonant synth-lead ROM voice, same family
    gm_program: "Lead 4 (chiff)"  # GM voice (was default square before the
                                  # switch work); chiff is the Dungeon2-
                                  # precedented match for Doctor Solo
    mt32_volume: 106                   # default 96; nudge the melody line up
    gm_volume: 106
    imfc_volume: 106
    pan: 84
    switches:                     # DEMO: rehearsal-2 independence (m10) with
                                  # return at the loop top (m2). Both points
                                  # verified as exact ch2 note edges (no note
                                  # sounds through 972 or 108/1836), so the
                                  # between-notes ERROR passes clean. File
                                  # order is by frame; playback across the wrap
                                  # reads m10 -> ... -> m17 -> (wrap) -> m2.
                                  # The m2 return re-states tick-0: no-op on
                                  # pass 1, load-bearing every pass after
                                  # (loop-aware no-op seed stays silent).
      - {m: 2, b: 1, mt32_program: "Doctor Solo", gm_program: "Lead 4 (chiff)", imfc_program: "SynLead"}
      - {m: 10, b: 1, mt32_program: "Violin 1", gm_program: "Violin", imfc_program: "SoloVio"}
  3:
    mt32_program: "Pizzicato"     # dry pluck for the eighth-note D pedal
                                  # and the treble crossing line; kills the
                                  # Warm Bell decay wash masking the squares
    imfc_program: "Pizzic1"       # short-decay pluck, same family
    mt32_volume: 60                    # user audition 2026-07-07: sit the pedal
    gm_volume: 60
                                  # well under the squares
    imfc_volume: 60
