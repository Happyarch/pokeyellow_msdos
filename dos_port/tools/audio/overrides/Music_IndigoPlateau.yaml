# Music_IndigoPlateau — per-song MIDI overrides (see README.md for schema).
#
# Frame-exact register/role audit from audio/music/indigoplateau.asm:
# ch1 is the low A-pedal tread (GB octave 2 A quarters = A3 MIDI, with
#   D3/D#3/A#2 punctuations and an F-G-A-A-F-A# final statement) — the
#   "footsteps" engine of the piece.
# ch2 is the D-pedal line (GB octave 3 D = D4 MIDI, melody channel per
#   analysis) rising to a C-C#-D-D-C-D# finale (GB octave 4 = MIDI 5).
# ch3 is sparse bell pings (GB octave 4 D = D5 MIDI, half notes with rests)
#   plus whole-note A5/D5/A#5/D#5 pillars in the final two bars.
# ch4 is a steady noise tread (ids 17/18/19).
# The default 80/80/38 voicing (two saxes + bell) would make a solemn
# D major/minor-ambiguous processional sound like a dance cue. Re-voice as
# low brass / trumpet lead / bell:
channels:
  1:
    mt32_program: "Trombone 1"
    gm_program: "Trombone"
    imfc_program: "Trombon"  # Bank4 low brass for the A-pedal tread
    mt32_volume: 90
    gm_volume: 90
    imfc_volume: 90
  2:
    mt32_program: "Trumpet 1"
    gm_program: "Trumpet"
    imfc_program: "Trumpet"  # Bank2 standard trumpet for the D-pedal lead
    mt32_volume: 96
    gm_volume: 96
    imfc_volume: 96
  3:
    mt32_program: "Warm Bell"
    gm_program: "Orchestral Harp"
    imfc_program: "Harp"  # plucked Bank2 voice matches the GM harp for the bell
                          # pings/pillars ("Bells" candidate — UNLISTENED)
    mt32_volume: 92
    gm_volume: 92
    imfc_volume: 92
# No drums: map: the GB noise tread stays on the default all-snare mapping
# (ids 17/18/19 -> 38). A kick/hat layering was considered but the GB noise
# timbres are UNVERIFIED by ear — left as an open audition question.
# No switches in this draft: a ch2 Trumpet -> Brs Sect 1 switch at the m15
# finale approach is a candidate if the human wants more arrival weight.
