# Music_Vermilion — per-song MIDI overrides (see README.md for schema).
#
# Default placeholder is 80/80/38: MT-32 factory "Sax 3" + "Sax 3" +
# "Warm Bell". That is how Celadon lost its second square — identical
# saxes collapse wherever the lines move together, and the bell's long
# decay + hall reverb washes the ostinato over both pulses. Vermilion
# is 4-channel and busier than Celadon (no rest, ch4 running the whole
# 12-bar loop), so the same default would bury the motoric inner line.
#
# Registers from the frame-exact sim: ch2 is the melody (A4–B5, long
# tones); ch1 is the motoric inner line (C#4–E5); ch3 is the high wave
# ostinato (E4–B4). Distinct instrument FAMILY per GB channel (Celadon's
# rule). Not a trumpet fanfare — the score note is optimistic port-town
# enthusiasm, not a heroic lead.
channels:
  1:
    mt32_program: "Fr Horn 2"   
    gm_program: "Trombone" 
    volume: 90
    pan: 44                      
  2:
    mt32_program: "Fr Horn 1"    # dual horns with separation
    gm_program: "Trumpet"   # GM only has one French Horn; improvised around using complementary brass
    volume: 106                  
    pan: 84
  3:
    mt32_program: "Pizzicato"     # dry pluck for the A–E / G#–E bounce;
    gm_program: "Pizzicato Strings"  # kills the Warm Bell decay wash
    volume: 68                    # sit the ostinato under both squares
