# Music_OaksLab — per-song MIDI overrides (see README.md for schema).
#
# Professor Oak's laboratory theme. A major, 4/4: a 2-beat Bm7 pickup, then
# a 16-measure body in two 8-measure statements (squares identical both
# times; only the wave texture changes — syncopated off-beats in statement
# 1, steady eighths in statement 2). Score transcription is
# professor_oaks_lab.md. A tier-1 sub_bass + low_pad (cascading to MT-32 as
# a string tenor) and a tier-3 celesta sparkle already exist; this file
# re-voices only the three GB channels and adds no switches.
#
# Channel roles (enhancement header audit + frame-exact analysis):
# ch2 (G#4..A5) is the melody, on top; ch1 (E4..E5) is the sustained
#   harmony just beneath it; ch3 (wave, A3..A4) is the motor ostinato.
#
# This file exists because there was NO override: the base renders on the
# 80/80/38 defaults — MT-32 factory "Sax 3" + "Sax 3" (identical timbres
# collapsing wherever ch1/ch2 move together) plus "Warm Bell" on ch3,
# whose long decay + hall reverb smears the 8th-note motor over the
# quiet-lab texture (at default volume 110).
channels:
  1:
    mt32_program: "Clarinet 1"  # same reed family as the sax lead — maximum
    gm_program: "Clarinet"      # blend, distinct preset (the distinguished-
                                # sisters idea across the reed choir);
                                # Clarinet 2 is the swap candidate if this
                                # one reads too dark/bright by ear
    imfc_program: "Clarine"     # Bank2 ROM1 reed, same family as Clarinet 1
    mt32_volume: 92                  # under the sax lead
    gm_volume: 92
    imfc_volume: 92             # mirrors volume (PalletTown precedent)
    pan: 20                     # harmony left, melody right
  2:
    mt32_program: "Sax 3"       # the liked lead voice, kept as-voiced
                                # (maintainer audition 2026-09-24)
    gm_program: "Trumpet"       # GM brass, NOT sax: this GM synth's sax
                                # samples play out of tune (GameCorner
                                # precedent); trumpet is the proven in-tune
                                # GM lead (Cities1 precedent)
    imfc_program: "Sax 1"       # Bank4 ROM3 sax family keeps the reed-choir lead
                                # on IMFC ("Sax 2"/"MonoSax" candidates — UNLISTENED)
    mt32_volume: 100                 # the tune — foreground
    gm_volume: 100
    imfc_volume: 100            # mirrors volume (PalletTown precedent)
    pan: 80
  3:
    mt32_program: "Shakuhachi"     # breathy flute for the 8th-note motor — airy
                                  # enough for the lab, reedy enough to sit with
                                  # the clarinet/sax choir (maintainer's final
                                  # pick; replaces Harp 1, tried over Koto)
    gm_program: "Shakuhachi"      # same voice on GM (stays in tune — unlike
                                  # the saxes, per the GameCorner lesson)
    imfc_program: "Reed"          # Bank4 ROM3 double-reed-ish voice for the motor
                                  # (EAR CHECK REQUIRED — Shakuhachi has no direct
                                  # IMFC equivalent; "Flute2"/"SlowFlt" fallbacks)
    mt32_volume: 80                    # motor present between the spread lines,
    gm_volume: 80
                                  # under the sax lead
    imfc_volume: 80               # mirrors volume (PalletTown precedent)
    pan: 50                       # near-center motor under the spread duo
