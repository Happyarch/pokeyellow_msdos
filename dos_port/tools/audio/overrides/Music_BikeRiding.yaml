# Music_BikeRiding — per-song MIDI overrides.
#
# AUDITION FINDINGS (maintainer): the default ch3 voice (Warm Bell at the
# default volume 110 — louder than either square) sits over the whole mix,
# so ch3 is pulled down to 96. Programs now explicit: ch2 keeps the liked
# Sax 3 lead (Pokecenter precedent voices it Alto Sax on GM); ch3 keeps
# Warm Bell (PkmnHealed precedent voices it Music Box on GM). Ch1's
# answering line gets Square Wave as the opening candidate — chip character
# against the reedy lead (Celadon ch1 precedent), since Sax 3 is not
# audible enough there. Ear decides if it stays.
channels:
  1:
    mt32_program: "Sax 2"        # blended sister under the Sax 3 lead (Pokecenter precedent): same reed
    gm_program: "Tenor Sax"      # family restores the GB two-squares texture instead of two soloists
    imfc_program: "Sax 2"       # lower sister under the lead (GameCorner precedent)
    volume: 90                   # under the lead; the 106 lift belonged to the distinct-voice attempt
    imfc_volume: 90
    pan: 44
  2:
    mt32_program: "Sax 3"        # the liked lead voice, kept as-was
    gm_program: "Alto Sax"
    imfc_program: "Sax 1"       # distinguished reed sister (no Sax 3 on IMFC; GameCorner precedent)
    volume: 92                   # eased 96->92; melody still leads
    imfc_volume: 92
    pan: 84
  3:
    mt32_program: "Warm Bell"
    gm_program: "Music Box"
    imfc_program: "TubeBe1"     # tubular bell (Warm Bell precedent: MeetEvilTrainer)
    volume: 90                   # was default 110, then 96; bell still sat over the mix
    imfc_volume: 90
    pan: 64
