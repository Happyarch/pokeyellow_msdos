# tools/audio/mt32/timbres.yaml — hand-editable MT-32 setup + custom timbres.
# Compiled by gen_mt32_patches.py into assets/mt32_sysex.inc, uploaded at
# init when /MT32. This is where the MUNT audition loop iterates (the MT-32
# counterpart of gen_opl_patches.py's PATCHES dict); `make assets` reads it,
# never writes it. Parameter names/ranges: gen_mt32_patches.py + docs/sound/
# Roland_MT_32_Midi_Implementation.md.

lcd: "POKEMON YELLOW  DOS!"

system:
  reverb_mode: 1          # 0 room, 1 hall, 2 plate, 3 tap delay
  reverb_time: 5          # 0-7
  reverb_level: 4         # 0-7
  # Parts 1-8 + rhythm; one message, sum <= 32. Parts 1-3 carry the three
  # GB melodic channels; rhythm gets the noise drums.
  partial_reserves: [10, 10, 4, 1, 1, 1, 1, 1, 3]
  # MT-32 part <- MIDI channel routing (parts 1-8 + rhythm).
  #
  # !! DO NOT "FIX" THESE TO [1,2,3,4,5,6,7,8,9]. THIS IS INTENTIONAL. !!
  #
  # [1,2,3,...] looks more natural and matches the Roland "0 = MIDI ch 1"
  # spec wording, but it is WRONG here and idles part 1 / shifts every voice
  # down one part in-game. This has bitten us twice. The values below are
  # VERIFIED CORRECT IN-GAME (dos_port/run-mt32) and MUST stay byte-identical
  # to assets/mt32_sysex.inc — the table the game actually uploads. `make
  # assets` regenerates that .inc from here, so a "cleanup" here silently
  # breaks the real routing. Load-bearing; leave it.
  #
  # (2026-07-09: audition.py once made [1,2,...] *look* right — that was
  #  standalone mt32emu-qt mishandling a live setup write, NOT the routing.
  #  audition.py now defaults to not sending this setup; see its --setup flag.)
  midi_channels: [2, 3, 4, 5, 6, 7, 8, 9, 9]
  master_volume: 100

# Custom timbres upload to Timbre Memory #1.. in list order at game boot.
# To play one, songs declare it by name (e.g. mt32_program: "Theremin").
# The audio pipeline compiles on-the-fly patch pointer rewrites (using the
# assigned `patch:` slot) and companion cleanup SysEx messages to restore
# factory parameters eagerly when the track finishes. Factory presets remain
# intact for all other tracks.
#
# 1. "JigglyVox" (2026-09-11, for Music_JigglypuffSong): byte-exact clone
#    of factory Funny Vox (patch #40), read out of MT32_CONTROL.ROM
#    (timbre table base 0x8080, 246-byte records in factory order —
#    verified: idx 0 "AcouPiano1", 47 "SquareWave", 48 "Str Sect 1",
#    39 "Funny Vox"). Purpose: pipeline self-test AND keyshift
#    experiment — if the clone nulls against factory Vox, the timbre
#    record is the whole recipe (patch key_shift neutral); if it lands
#    an octave off, the patch record transposes and the clone takes a
#    coarse correction. Either way the ear decides the next tweak.
#    The Vox vocal recipe, decoded: ONE partial (mute 0x01 — bit set =
#    sounding), octave-up SAW (coarse 48) with a slow pitch SCOOP into
#    the note (penv depth 7, times 20/22/39), an OPENING filter
#    (cutoff 69 + reso 28, env depth 29 swelling 15→90 — the vowel
#    forming), strong vibrato (rate 62, depth 21), fast attack
#    (tva t1=0) swelling 80→100. 1 partial — fits any reserve.
#    Staged at Patch #28 (2026-09-12, was #127 Water Bells) — routing
#    change only, the timbre bytes are untouched.
#
# 2. "ChipSaw" (2026-09-12): neutral concert-pitch SAW reference for
#    chip-lead doubling (GB pulse leads that want an MT-32-native saw
#    instead of factory Square Wave's detuned chorus pair). v2: TWO
#    partials (mute 0x03), mirroring Square Wave's architecture with the
#    base function swapped — detuned twin (fine 56/44, a touch wider
#    than factory's 53/47), gentle vibrato both partials (rate 60,
#    depth 9 — a third of factory's 23), staggered attack (P1 t1=1,
#    P2 t1=6 swelling 92→98→100, the factory bloom), TVF pinned open
#    (cutoff 100, reso 0, env depth 0 — no factory edge; the A/B stays
#    about the oscillator). Output level matched to Square Wave
#    (tva 70 both partials — at 100 ChipSaw overpowered it; saws read
#    louder per unit level, so 70 is a starting match, not a verdict).
#    Unison SAW (coarse 36, kf 16, bender on),
#    sustain 100, reverb on. Benchmarked against a real ReSID 6581 saw
#    (NTSC, VICE x64sc: bare SID, AD=0/SR=$F0/VOL=15, filter out,
#    440 Hz): f0 440.00 Hz, harmonics 1/n within a few % (2nd 0.52,
#    4th 0.27 — the 6581's slightly hot evens), time-domain MAE 3.6%
#    vs ideal ramp (residual = 12-bit steps + R-2R MSB notch + finite
#    flyback). Regen: tokenized BASIC PRG poking $D400-418 (freq word
#    HALVED — this VICE build sounds 2x the written word, measured),
#    captured via ALSA file-plugin PCM. 2 partials — same cost as the
#    factory chorus it replaces. Staged at Patch #27. GM counterpart
#    for track use: "Lead 2 (sawtooth)".
#
# 3. "Theremin" (2026-09-12): authentic RCA theremin model. Grounded in
#    oscilloscope traces and circuit analysis of the 1929 RCA Theremin:
#    un-biased vacuum-tube heterodyning clips one half of the beat waveform,
#    producing an asymmetric ~25% duty cycle pulse wave (rich even/odd low
#    harmonics a1=0.71, a2=1.00, a3=0.71, resembling the human glottal
#    pulse). The RCA 106 speaker and transformers act as a steep formant/
#    low-pass filter (~1.8 kHz cutoff) with gentle cavity resonance.
#    MT-32 LA synthesis recipe: ONE partial (mute 0x01, fits any reserve),
#    pulse wave (wg_waveform 0, wg_pulse_width 25 — 25% duty cycle), concert
#    pitch (coarse 36, fine 50, keyfollow 16, bender on). Subtle onset pitch
#    scoop (penv depth 2, time1 14, lvl0 48 -> lvl1 50) mimicking human spatial
#    drift. Expressive classical Rockmore vibrato (plfo rate 60, depth 16,
#    mod sens 60). Low-pass formant filter (tvf cutoff 52, reso 15, keyfollow
#    10, env depth 14 blooming 88 -> 78 sustain). Non-percussive volume antenna
#    envelope (tva lvl 88, t1=6 soft attack ~25ms, lvl1 94 -> lvl2 100,
#    sustain 100, t5=14 singing ~350ms release into hall reverb).
#    Staged at Patch #12 (Elec Org 4 quint organ rewrite — 0-based PC byte 11).
#    Syn Brass 1 and Syn Brass 2 (Patches #25 and #26) remain factory-intact.
#    GM counterpart for track use: "Lead 6 (voice)".
#
# 4. "NightWind" (2026-09-12): authentic aerodynamic wind turbulence model
#    built on Roland MT-32's acoustic BottleBlow Helmholtz resonator excitation.
#    Wind howling through broken stone windows and hollow towers acts as a
#    natural Helmholtz resonator excited by turbulent airflow — exactly the
#    physical acoustic mechanism captured in MT-32's PCM 28 (BottleBlow).
#    Calibrated against empirical spectrum of authentic howling storm wind (15:45 mark):
#    measured ~99.7% energy concentrated in 20-1200 Hz with dominant resonant peak
#    at 222.7 Hz and virtually zero energy (<0.3%) above 1200 Hz.
#    2 partials (Structure 3: P+S — acoustic BottleBlow + resonant cavity Saw):
#    Partial 1: PCM 28 (Roland BottleBlow sample) tuned to coarse 33 (220 Hz, exactly
#    matching the measured 222.7 Hz peak) with resonant cavity TVF cutoff 56, reso 18.
#    Partial 2: Low-pass filtered Sawtooth partial tuned to coarse 30 with TVF cutoff 50,
#    reso 14, and slow aerodynamic gust drift LFO (rate 18, depth 12).
#    No PCM 80 (eliminates all 11 kHz high-frequency static and hi-hat noise).
#    Both partials use keyfollow 0 (non-tonal, key-independent) and gentle,
#    undulating breathing envelopes (tva_env_time1 65 ~1.3s soft attack,
#    tva_env_time5 70 ~1.8s release) allowing continuous polyphonic crossfading.
#    Staged at Patch #126 (0-based PC byte 125, replacing factory demo loop preset "One Note Jam").
#    GM counterpart for track use: "Breath Noise" (program 122).
